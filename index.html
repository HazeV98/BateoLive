<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#e0e0e0">
    <title>BateoLive</title>

    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="apple-touch-icon" href="assets/icon.png">

    <!-- Il modulo BateoLive crea autonomamente tutta la UI e carica Leaflet/OMS. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script defer
        src="https://api.bateolive.stream/stats/script.js"
        data-website-id="2b1a80cf-f9e6-4173-9ff3-0c1adefe19e3"
        data-host-url="https://bateolive.tailec23c3.ts.net/stats">
    </script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #e0e0e0;
        }

        body {
            position: fixed;
            inset: 0;
            font-family: 'Inter', sans-serif;
        }

        /* Schermata minima solo durante il caricamento del modulo. */
        #boot-screen {
            position: fixed;
            inset: 0;
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            background: #e0e0e0;
            color: #00529b;
            transition: opacity .2s ease;
        }

        #boot-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #boot-screen i { font-size: 28px; }
        #boot-screen span { font-size: 14px; font-weight: 600; }

        #boot-error {
            display: none;
            max-width: 85vw;
            padding: 16px;
            border-radius: 12px;
            background: #fff;
            color: #b00020;
            box-shadow: 0 5px 20px rgba(0,0,0,.18);
            text-align: center;
            line-height: 1.45;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="boot-screen">
        <i class="fa-solid fa-ship fa-beat"></i>
        <span>Caricamento BateoLive…</span>
        <div id="boot-error"></div>
    </div>

    <!--
        BateoLive è completamente gestito dal modulo.
        index.html non contiene più una seconda copia della UI o della logica.

        File richiesti nella stessa cartella:
          - bateolive.js
          - turni-core.js
    -->
    <script type="module">
        import {
            initUIBateoLive,
            avviaMotoreBateoLive
        } from './bateolive_standalone.js';

        const boot = document.getElementById('boot-screen');
        const errorBox = document.getElementById('boot-error');

        try {
            // Il modulo è autonomo: non dipende da Firebase per la modalità standalone.
            initUIBateoLive();
            await avviaMotoreBateoLive(
                null,
                null,
                { nome: 'Collega', mansione: null },
                false
            );

            boot.classList.add('hidden');
            setTimeout(() => boot.remove(), 250);
        } catch (error) {
            console.error('Errore avvio BateoLive:', error);
            errorBox.style.display = 'block';
            errorBox.innerHTML = `
                <strong>Impossibile avviare BateoLive.</strong><br>
                Controlla che <b>bateolive_standalone.js</b> e <b>turni-core.js</b> siano nella stessa cartella di questo index.html.<br><br>
                <small>${String(error?.message || error)}</small>
            `;
            boot.querySelector('i').style.display = 'none';
            boot.querySelector('span').style.display = 'none';
        }
    </script>
</body>
</html>
